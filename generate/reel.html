<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #05110C;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background ── */
    #bg {
      position: absolute;
      inset: 0;
      background: #05110C;
    }
    #glow1 {
      position: absolute;
      width: 960px; height: 960px; border-radius: 50%;
      background: radial-gradient(circle, rgba(20,150,108,.38) 0%, transparent 65%);
      top: -260px; left: -180px;
    }
    #glow2 {
      position: absolute;
      width: 740px; height: 740px; border-radius: 50%;
      background: radial-gradient(circle, rgba(10,122,83,.30) 0%, transparent 65%);
      bottom: 80px; right: -120px;
    }
    #glow3 {
      position: absolute;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(61,203,146,.12) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
    }
    #grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
      background-size: 80px 80px;
      -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 15%, transparent 80%);
      mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 15%, transparent 80%);
      opacity: 0;
    }

    /* ── Phase 1: Problem ── */
    #phase-problem {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 90px;
      opacity: 0;
    }
    #problem-tag {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .22em;
      color: #3DCB92;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: 0;
      transform: translateX(-50px);
    }
    #problem-dot {
      flex-shrink: 0;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3DCB92;
      box-shadow: 0 0 0 5px rgba(61,203,146,.22);
    }
    #problem-divider {
      height: 1.5px;
      background: linear-gradient(90deg, #3DCB92 0%, rgba(61,203,146,.08) 100%);
      margin-bottom: 52px;
      transform-origin: left;
      transform: scaleX(0);
      opacity: 0;
    }
    #problem-text {
      font-weight: 800;
      line-height: 1.13;
      letter-spacing: -.025em;
      color: #fff;
      opacity: 0;
      transform: translateY(36px);
    }

    /* ── Phase 2: Countdown ── */
    #phase-countdown {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      opacity: 0;
    }
    #days-num {
      font-size: 290px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.04em;
      color: transparent;
      -webkit-text-stroke: 3.5px #3DCB92;
      text-stroke: 3.5px #3DCB92;
      opacity: 0;
      transform: translateY(-80px);
    }
    #days-unit {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: .32em;
      color: #8BEBC4;
      text-transform: uppercase;
      margin-top: 24px;
      opacity: 0;
      text-align: center;
    }
    #days-until {
      font-size: 25px;
      font-weight: 400;
      color: rgba(255,255,255,.42);
      letter-spacing: .07em;
      margin-top: 14px;
      text-align: center;
      opacity: 0;
    }

    /* ── Phase 3: Brand (bottom) ── */
    #phase-brand {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0 90px 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
    }
    #brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      border-radius: 999px;
      border: 1.5px solid rgba(61,203,146,.35);
      background: rgba(61,203,146,.08);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .12em;
      color: #3DCB92;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px);
    }
    #brand-chip-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3DCB92;
      box-shadow: 0 0 0 4px rgba(61,203,146,.25);
    }
    #brand-logo {
      font-size: 68px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.03em;
      opacity: 0;
      transform: translateY(16px);
    }
    #brand-logo .x { color: #3DCB92; }
    #brand-date {
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,.5);
      letter-spacing: .05em;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div id="bg">
    <div id="glow1"></div>
    <div id="glow2"></div>
    <div id="glow3"></div>
    <div id="grid"></div>
  </div>

  <!-- Phase 1: Problem -->
  <div id="phase-problem">
    <div id="problem-tag"><div id="problem-dot"></div>The Problem</div>
    <div id="problem-divider"></div>
    <div id="problem-text">PROBLEM_TEXT</div>
  </div>

  <!-- Phase 2: Countdown -->
  <div id="phase-countdown">
    <div id="days-num">20</div>
    <div id="days-unit">Days To Go</div>
    <div id="days-until">Until AlongXide</div>
  </div>

  <!-- Phase 3: Brand -->
  <div id="phase-brand">
    <div id="brand-chip"><div id="brand-chip-dot"></div>Launching Dec 4</div>
    <div id="brand-logo">Along<span class="x">X</span>ide</div>
    <div id="brand-date">Benin City · Abuja</div>
  </div>

  <script>
    // Inject problem text and days count from URL params
    const q = new URLSearchParams(location.search);
    const problemText = q.get('problem') || 'THE PROBLEM';
    const daysCount = q.get('days') || '20';

    document.getElementById('problem-text').textContent = problemText;
    document.getElementById('days-num').textContent = daysCount;

    // Auto-size problem text by character length
    const len = problemText.length;
    document.getElementById('problem-text').style.fontSize =
      (len < 32 ? 92 : len < 46 ? 80 : len < 60 ? 70 : 60) + 'px';

    // ── Helpers ──────────────────────────────────────────────────────────
    const cl  = (x, lo=0, hi=1) => Math.max(lo, Math.min(hi, x));
    const n01 = (t, a, b) => cl((t - a) / (b - a));
    const eio = t => t < .5 ? 2*t*t : 1 - (-2*t+2)**2/2;
    const eo  = t => 1 - (1-t)**3;
    const ei  = t => t * t * t;
    const spr = t => {
      if (t >= 1) return 1;
      return 1 - Math.exp(-10 * t) * Math.cos(Math.sqrt(1 - 0.35*0.35) * 10 * t);
    };
    const mix = (a, b, t) => a + (b - a) * t;

    const $ = id => document.getElementById(id);

    // ── Seek ─────────────────────────────────────────────────────────────
    window.seek = (ms) => {
      const t = ms / 1000;

      // Background grid fades in
      $('grid').style.opacity = eio(n01(t, 0, 1));

      // Glow drift (sinusoidal)
      const d1 = Math.sin(t * 0.45) * 55;
      const d2 = Math.sin(t * 0.35 + 1.2) * 45;
      $('glow1').style.transform = `translate(${d1*0.5}px, ${d1}px)`;
      $('glow2').style.transform = `translate(${-d2*0.6}px, ${-d2*0.9}px)`;

      // ── Phase 1: Problem (0-9s) ──────────────────────────────────────
      const p1 = t < 1 ? eio(n01(t,.4,1)) : t < 8 ? 1 : 1 - eio(n01(t, 8, 9));
      $('phase-problem').style.opacity = p1;

      // "THE PROBLEM" tag slides in from left
      const tagP = eio(n01(t, .8, 1.5));
      $('problem-tag').style.opacity = tagP;
      $('problem-tag').style.transform = `translateX(${mix(-55, 0, tagP)}px)`;

      // Divider line extends
      const divP = eo(n01(t, 1.2, 2.1));
      $('problem-divider').style.opacity = divP;
      $('problem-divider').style.transform = `scaleX(${divP})`;

      // Problem text fades up
      const txtP = eio(n01(t, 1.9, 3.0));
      $('problem-text').style.opacity = txtP;
      $('problem-text').style.transform = `translateY(${mix(36, 0, txtP)}px)`;

      // ── Phase 2: Countdown (9-15s) ──────────────────────────────────
      $('phase-countdown').style.opacity = eio(n01(t, 9.0, 9.5));

      // Days number drops in with spring
      const numP = spr(n01(t, 9.0, 10.3));
      $('days-num').style.opacity = cl(numP * 2.5);
      $('days-num').style.transform = `translateY(${mix(-80, 0, cl(numP))}px)`;

      // "DAYS TO GO" reveals
      const unitP = eio(n01(t, 10.1, 10.8));
      $('days-unit').style.opacity = unitP;
      $('days-unit').style.letterSpacing = mix(0.05, 0.32, unitP) + 'em';

      // "Until AlongXide"
      $('days-until').style.opacity = eo(n01(t, 10.8, 11.5));

      // ── Phase 3: Brand (11.5-15s) ────────────────────────────────────
      $('phase-brand').style.opacity = eio(n01(t, 11.5, 12.0));

      const chipP = eio(n01(t, 11.5, 12.3));
      $('brand-chip').style.opacity = chipP;
      $('brand-chip').style.transform = `translateY(${mix(20, 0, chipP)}px)`;

      const logoP = eio(n01(t, 12.0, 12.9));
      $('brand-logo').style.opacity = logoP;
      $('brand-logo').style.transform = `translateY(${mix(16, 0, logoP)}px)`;

      $('brand-date').style.opacity = eo(n01(t, 12.6, 13.4));
    };

    // Initialise hidden, wait for fonts
    window.seek(0);
    window.__ready = document.fonts.ready.then(() => true);
  </script>
</body>
</html>
