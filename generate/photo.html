<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px; height: 1350px;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #header {
      height: 160px;
      background: #3DCB92;
      padding: 0 80px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #logo { font-size: 50px; font-weight: 800; color: #fff; letter-spacing: -.03em; }
    #logo .x { color: rgba(255,255,255,.60); }
    #header-tag { font-size: 17px; font-weight: 700; color: rgba(255,255,255,.78); letter-spacing: .18em; text-transform: uppercase; }

    #illus-zone {
      height: 420px;
      display: flex; align-items: center; justify-content: center;
      position: relative; background: #fff;
    }
    #illus-bg {
      position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: rgba(61,203,146,.08);
    }
    #illus-svg { width: 320px; height: 300px; position: relative; z-index: 1; }

    #body { padding: 50px 80px 32px; overflow: hidden; }

    #spotlight-label {
      font-size: 16px; font-weight: 700; letter-spacing: .24em;
      color: #3DCB92; text-transform: uppercase;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    #spotlight-label::before {
      content: ''; display: block; width: 9px; height: 9px;
      border-radius: 50%; background: #3DCB92; flex-shrink: 0;
    }

    #feature-title {
      font-size: 88px; font-weight: 900; line-height: 1.0;
      letter-spacing: -.03em; color: #0a0a0a;
      white-space: pre-line; margin-bottom: 36px;
    }

    #accent-bar {
      width: 100%; height: 4px;
      background: linear-gradient(90deg, #3DCB92 0%, rgba(61,203,146,.12) 100%);
      border-radius: 2px; margin-bottom: 36px;
    }

    #feature-desc {
      font-size: 34px; font-weight: 400; line-height: 1.55;
      color: #2a2a2a; margin-bottom: 40px;
    }

    #pills { display: flex; flex-wrap: wrap; gap: 14px; }
    .pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 12px 22px; border-radius: 999px;
      border: 2px solid rgba(61,203,146,.28);
      background: rgba(61,203,146,.05);
      font-size: 19px; font-weight: 600; color: #1a1a1a;
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #3DCB92; flex-shrink: 0; }

    #footer {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 156px; background: #05110C;
      padding: 0 80px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #countdown-block { display: flex; align-items: baseline; gap: 12px; }
    #count-num { font-size: 68px; font-weight: 900; color: #3DCB92; line-height: 1; letter-spacing: -.03em; }
    #count-label { font-size: 20px; font-weight: 600; color: rgba(255,255,255,.52); letter-spacing: .04em; }
    #footer-right { text-align: right; }
    #footer-brand { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    #footer-brand .x { color: #3DCB92; }
    #footer-sub { font-size: 15px; color: rgba(255,255,255,.36); margin-top: 5px; letter-spacing: .04em; }
  </style>
</head>
<body>

<div id="header">
  <div id="logo">Along<span class="x">X</span>ide</div>
  <div id="header-tag">Feature Spotlight</div>
</div>

<div id="illus-zone">
  <div id="illus-bg"></div>

    <div class="pill"><div class="pill-dot"></div>Dec 4</div>
  </div>

<div id="footer">
  <div id="countdown-block">
    <div id="count-num">19</div>
    <div id="count-label">days to go</div>
  </div>
  <div id="footer-right">
    <div id="footer-brand">Along<span class="x">X</span>ide</div>
    <div id="footer-sub">Benin City · Abuja · Launching Dec 4</div>
  </div>
